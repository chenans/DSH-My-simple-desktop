<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<title>用量统计 — DSH My Simple Desktop</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76;
    --card: #f6f8fa; --border: #d0d7de; --accent: #4d6bfe;
    --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
    --bar1: #4d6bfe; --bar2: #2da44e; --bar3: #fb8f44; --bar4: #8957e5; --bar5: #f778ba;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1f1f; --fg: #e6e6e6; --muted: #9d9d9d;
      --card: #2b2b2b; --border: #3f3f3f; --accent: #6b85ff;
      --ok: #3fb950; --warn: #d29922; --err: #f85149;
      --bar1: #6b85ff; --bar2: #3fb950; --bar3: #fb8f44; --bar4: #a37ff5; --bar5: #f778ba;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
  }

  /* Content area */
  .content-area {
    padding: 20px 24px 28px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 18px; }

/* Controls */
.controls {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
  flex-wrap: wrap;
}
.controls label { font-weight: 600; font-size: 13px; }
select, button {
  font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--card); color: var(--fg);
}
select:hover, button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.refresh-btn { margin-left: auto; }

/* Custom date range */
.custom-range {
  display: none; align-items: center; gap: 8px; flex-wrap: wrap;
}
.custom-range.show { display: flex; }
.custom-range input[type="date"] {
  font: inherit; padding: 5px 10px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--card); color: var(--fg);
}
.custom-range input[type="date"]:hover { border-color: var(--accent); }
.custom-range .sep { color: var(--muted); font-size: 13px; }
.custom-range .quick-btn {
  font-size: 12px; padding: 4px 10px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer;
}
.custom-range .quick-btn:hover { border-color: var(--accent); color: var(--fg); }

/* Summary cards */
.summary-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px; margin-bottom: 24px;
}
.stat-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 16px;
}
.stat-card .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.stat-card .value { font-size: 22px; font-weight: 700; }
.stat-card .unit { font-size: 12px; color: var(--muted); margin-left: 4px; }

/* Section */
.section {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 18px; margin-bottom: 16px;
}
.section h2 { font-size: 15px; margin: 0 0 12px; }

/* Table */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
tr:hover td { background: var(--bg); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
td.path { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.empty { color: var(--muted); text-align: center; padding: 40px; }
.loading { color: var(--muted); text-align: center; padding: 40px; }
.spinner {
  width: 32px; height: 32px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <!-- Main content -->
  <div class="content-area">
    <h1>用量统计</h1>
    <p class="sub" id="appMeta">统计 dsh 会话的 token 使用量、工作区/项目分布、交互次数等</p>

  <div class="controls">
    <label>时间粒度：</label>
    <select id="granularity">
      <option value="auto">自动</option>
      <option value="day">按天</option>
      <option value="week">按周</option>
      <option value="month">按月</option>
      <option value="year">按年</option>
    </select>
    <label>时间范围：</label>
    <select id="range">
      <option value="all">全部</option>
      <option value="7d">最近 7 天</option>
      <option value="30d">最近 30 天</option>
      <option value="90d">最近 90 天</option>
      <option value="365d">最近 1 年</option>
      <option value="custom">自定义…</option>
    </select>
    <div class="custom-range" id="customRange">
      <input type="date" id="dateStart" />
      <span class="sep">至</span>
      <input type="date" id="dateEnd" />
      <button class="quick-btn" id="thisMonth">本月</button>
      <button class="quick-btn" id="lastMonth">上月</button>
      <button class="quick-btn" id="thisYear">今年</button>
      <button class="quick-btn" id="lastYear">去年</button>
    </div>
    <button class="primary refresh-btn" id="refresh">刷新</button>
  </div>

  <div id="content">
    <div class="loading">正在加载…</div>
  </div>
  </div>

<script>
'use strict';
const api = window.dshDesktop;
const $ = (id) => document.getElementById(id);

function fmt(n) {
  if (n == null || n === 0) return '0';
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}

function fmtMs(ms) {
  if (!ms || ms === 0) return '0';
  if (ms < 1000) return ms + 'ms';
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
  return (ms / 60000).toFixed(1) + 'min';
}

function fmtDate(ts) {
  if (!ts) return '-';
  const d = new Date(ts);
  return d.toLocaleDateString('zh-CN');
}

function maxVal(rows, key) {
  let max = 0;
  for (const r of rows) { if (r[key] > max) max = r[key]; }
  return max || 1;
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderSummary(stats) {
  const s = stats.summary;
  // dsh does not record cache-write amounts (ledger cacheWriteTokens is
  // always 0); show "未记录" instead of a misleading 0.
  const cacheWriteVal = s.totalCacheWrite > 0 ? fmt(s.totalCacheWrite) : '未记录';
  const cards = [
    { label: '总会话数', value: s.totalSessions, unit: '个' },
    { label: '总交互轮次', value: s.totalTurns, unit: '轮' },
    { label: '总操作步数', value: s.totalSteps, unit: '步' },
    { label: '总 Token', value: fmt(s.totalTokens), unit: '' },
    { label: '输入 Token', value: fmt(s.totalInputTokens), unit: '' },
    { label: '输出 Token', value: fmt(s.totalOutputTokens), unit: '' },
    { label: '缓存读取', value: fmt(s.totalCacheRead), unit: '' },
    { label: '缓存写入', value: cacheWriteVal, unit: '', title: '当前数据源未记录缓存写入量' },
    { label: '调用次数', value: s.totalCalls || 0, unit: '次' },
  ];
  return '<div class="summary-grid">' + cards.map(c =>
    `<div class="stat-card"${c.title ? ` title="${c.title}"` : ''}><div class="label">${c.label}</div><div class="value">${c.value}<span class="unit">${c.unit}</span></div></div>`
  ).join('') + '</div>';
}

/**
 * Render a proper vertical bar chart + line overlay as inline SVG
 * (no external chart library, respects the strict CSP).
 * Bars = total tokens per period; line = calls (activity, correlates with
 * token spend) — falls back to sessions only when no call data exists.
 * Using calls (not sessions) keeps the line trending with the bars:
 * sessions are few (0..n per day) and often anticorrelate with token
 * volume, which made the two series look "inconsistent".
 */
function renderPeriodChart(periods, granularity) {
  if (!periods || periods.length === 0) return '<div class="empty">暂无数据</div>';
  const n = periods.length;
  const W = 940, H = 300, L = 60, R = 60, T = 18, B = 40;
  const plotW = W - L - R;
  const plotH = H - T - B;

  const maxTokens = maxVal(periods, 'totalTokens');
  const maxCalls = maxVal(periods, 'calls');
  const maxSessions = maxVal(periods, 'sessions');
  // Activity line: prefer calls (directly tracks token spend), fall back to
  // sessions only when there are no calls anywhere in the window.
  const lineKey = maxCalls > 1 ? 'calls' : (maxSessions > 1 ? 'sessions' : null);
  const maxLine = lineKey ? maxVal(periods, lineKey) : 0;

  const slot = plotW / n;
  const barW = Math.max(2, slot * 0.58);
  const ticks = 4;

  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="按时间分布图表">`;

  // Grid + left axis (tokens)
  for (let i = 0; i <= ticks; i++) {
    const y = T + plotH - (i / ticks) * plotH;
    const val = (maxTokens * i) / ticks;
    svg += `<line x1="${L}" y1="${y.toFixed(1)}" x2="${W - R}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
    svg += `<text x="${L - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(val)}</text>`;
  }

  // Bars (total tokens)
  periods.forEach((p, i) => {
    const h = maxTokens > 1 ? (p.totalTokens / maxTokens) * plotH : 0;
    const x = L + i * slot + (slot - barW) / 2;
    const y = T + plotH - h;
    svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="var(--bar1)" rx="2">`;
    svg += `<title>${esc(p.period)}: 总 ${fmt(p.totalTokens)} token · ${p.sessions} 会话 · ${p.turns} 轮 · ${p.steps} 步 · ${p.calls} 次调用</title></rect>`;
  });

  // Line (calls or sessions)
  if (lineKey && maxLine > 1) {
    const pts = periods.map((p, i) => {
      const x = L + i * slot + slot / 2;
      const y = T + plotH - (p[lineKey] / maxLine) * plotH;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="var(--bar2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    periods.forEach((p, i) => {
      const x = L + i * slot + slot / 2;
      const y = T + plotH - (p[lineKey] / maxLine) * plotH;
      svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--bar2)"><title>${esc(p.period)}: ${p[lineKey]} ${lineKey === 'sessions' ? '会话' : '调用'}</title></circle>`;
    });
  }

  // X labels (sparse when many points)
  const labelStep = Math.max(1, Math.ceil(n / 14));
  periods.forEach((p, i) => {
    if (i % labelStep !== 0 && i !== n - 1) return;
    const x = L + i * slot + slot / 2;
    const label = shortPeriod(p.period, granularity);
    svg += `<text x="${x.toFixed(1)}" y="${H - B + 16}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(label)}</text>`;
  });

  // Legend
  svg += `<rect x="${W - R - 150}" y="4" width="12" height="12" fill="var(--bar1)" rx="2"/><text x="${W - R - 134}" y="14" font-size="11" fill="var(--muted)">总 Token</text>`;
  if (lineKey) {
    svg += `<line x1="${W - R - 84}" y1="10" x2="${W - R - 70}" y2="10" stroke="var(--bar2)" stroke-width="2"/>`;
    svg += `<circle cx="${W - R - 77}" cy="10" r="3" fill="var(--bar2)"/>`;
    svg += `<text x="${W - R - 64}" y="14" font-size="11" fill="var(--muted)">${lineKey === 'sessions' ? '会话数' : '调用次数'}</text>`;
  }

  svg += '</svg>';
  return svg;
}

function shortPeriod(p, granularity) {
  if (granularity === 'day' || granularity === 'week') return String(p).slice(5); // MM-DD
  return String(p);
}

function renderProjectTable(projects) {
  if (!projects || projects.length === 0) return '<div class="empty">暂无项目数据</div>';
  let html = '<table><thead><tr>';
  html += '<th>项目</th><th class="num">会话数</th><th class="num">交互轮次</th><th class="num">操作步数</th>';
  html += '<th class="num">输入 Token</th><th class="num">输出 Token</th><th class="num">总 Token</th>';
  html += '<th class="num">平均耗时</th><th>最后使用</th>';
  html += '</tr></thead><tbody>';
  for (const p of projects) {
    const totalTok = p.inputTokens + p.outputTokens + p.cacheRead + p.cacheWrite;
    const avgMs = p.sessions > 0 ? Math.round(p.llmMs / p.sessions) : 0;
    html += `<tr>
      <td><strong>${esc(p.project)}</strong></td>
      <td class="num">${p.sessions}</td>
      <td class="num">${p.turns}</td>
      <td class="num">${p.steps}</td>
      <td class="num">${fmt(p.inputTokens)}</td>
      <td class="num">${fmt(p.outputTokens)}</td>
      <td class="num">${fmt(totalTok)}</td>
      <td class="num">${fmtMs(avgMs)}</td>
      <td>${fmtDate(p.lastUsed)}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  return html;
}

function renderWorkspaceTable(workspaces) {
  if (!workspaces || workspaces.length === 0) return '<div class="empty">暂无工作区数据</div>';
  let html = '<table><thead><tr>';
  html += '<th>工作区</th><th>路径</th><th class="num">会话数</th><th class="num">交互轮次</th><th class="num">操作步数</th>';
  html += '<th class="num">输入 Token</th><th class="num">输出 Token</th><th class="num">总 Token</th>';
  html += '<th class="num">平均耗时</th><th>最后使用</th>';
  html += '</tr></thead><tbody>';
  for (const w of workspaces) {
    const totalTok = w.inputTokens + w.outputTokens + w.cacheRead + w.cacheWrite;
    const avgMs = w.sessions > 0 ? Math.round(w.llmMs / w.sessions) : 0;
    html += `<tr>
      <td><strong>${esc(w.title)}</strong></td>
      <td class="path" title="${esc(w.path)}">${esc(w.path)}</td>
      <td class="num">${w.sessions}</td>
      <td class="num">${w.turns}</td>
      <td class="num">${w.steps}</td>
      <td class="num">${fmt(w.inputTokens)}</td>
      <td class="num">${fmt(w.outputTokens)}</td>
      <td class="num">${fmt(totalTok)}</td>
      <td class="num">${fmtMs(avgMs)}</td>
      <td>${fmtDate(w.lastUsed)}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  return html;
}

function renderModelTable(models) {
  if (!models || models.length === 0) return '<div class="empty">暂无模型数据</div>';
  let html = '<table><thead><tr>';
  html += '<th>模型</th><th>Provider</th><th class="num">输入 Token</th><th class="num">输出 Token</th>';
  html += '<th class="num">缓存读取</th><th class="num">缓存写入</th><th class="num">总 Token</th><th class="num">调用次数</th>';
  html += '</tr></thead><tbody>';
  for (const m of models) {
    html += `<tr>
      <td><strong>${esc(m.model)}</strong></td>
      <td>${esc(m.provider)}</td>
      <td class="num">${fmt(m.inputTokens)}</td>
      <td class="num">${fmt(m.outputTokens)}</td>
      <td class="num">${fmt(m.cacheRead)}</td>
      <td class="num">${m.cacheWrite > 0 ? fmt(m.cacheWrite) : '未记录'}</td>
      <td class="num"><strong>${fmt(m.totalTokens)}</strong></td>
      <td class="num">${m.calls}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  return html;
}

function renderProviderTable(providers) {
  if (!providers || providers.length === 0) return '<div class="empty">暂无 Provider 数据</div>';
  let html = '<table><thead><tr>';
  html += '<th>Provider</th><th class="num">输入 Token</th><th class="num">输出 Token</th>';
  html += '<th class="num">缓存读取</th><th class="num">缓存写入</th><th class="num">总 Token</th><th class="num">调用次数</th><th class="num">余额</th>';
  html += '</tr></thead><tbody>';
  for (const p of providers) {
    html += `<tr>
      <td><strong>${esc(p.provider)}</strong></td>
      <td class="num">${fmt(p.inputTokens)}</td>
      <td class="num">${fmt(p.outputTokens)}</td>
      <td class="num">${fmt(p.cacheRead)}</td>
      <td class="num">${p.cacheWrite > 0 ? fmt(p.cacheWrite) : '未记录'}</td>
      <td class="num"><strong>${fmt(p.totalTokens)}</strong></td>
      <td class="num">${p.calls}</td>
      <td class="num">${p.balance != null ? p.balance + ' ' + (p.currency || '') : '-'}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  return html;
}

async function loadStats() {
  const content = $('content');
  content.innerHTML = '<div class="loading"><div class="spinner"></div>正在统计用量数据…</div>';

  const granularity = $('granularity').value;
  const rangeVal = $('range').value;

  let range = null;
  if (rangeVal === 'custom') {
    const startStr = $('dateStart').value;
    const endStr = $('dateEnd').value;
    if (startStr && endStr) {
      const start = new Date(startStr + 'T00:00:00').getTime();
      const end = new Date(endStr + 'T23:59:59.999').getTime();
      if (start <= end) {
        range = { start, end };
      }
    } else if (startStr) {
      range = { start: new Date(startStr + 'T00:00:00').getTime(), end: Date.now() };
    }
  } else if (rangeVal !== 'all') {
    const days = parseInt(rangeVal);
    const end = Date.now();
    const start = end - days * 24 * 60 * 60 * 1000;
    range = { start, end };
  }

  try {
    const stats = await api.usage.getStats(granularity, range);
    let html = renderSummary(stats);

    // Time distribution (bar + line chart)
    if (stats.periods && stats.periods.length > 0) {
      html += `<div class="section"><h2>按时间分布（粒度：${stats.granularity}）</h2>${renderPeriodChart(stats.periods, stats.granularity)}</div>`;
    }

    // Workspace breakdown
    if (stats.workspaces && stats.workspaces.length > 0) {
      html += `<div class="section"><h2>按工作区统计</h2>${renderWorkspaceTable(stats.workspaces)}</div>`;
    }

    // Project breakdown (from session projcache)
    if (stats.projects && stats.projects.length > 0) {
      html += `<div class="section"><h2>按项目统计</h2>${renderProjectTable(stats.projects)}</div>`;
    }

    // Model breakdown
    if (stats.models && stats.models.length > 0) {
      html += `<div class="section"><h2>按模型统计</h2>${renderModelTable(stats.models)}</div>`;
    }

    // Provider breakdown
    if (stats.providers && stats.providers.length > 0) {
      html += `<div class="section"><h2>按 Provider 统计</h2>${renderProviderTable(stats.providers)}</div>`;
    }

    content.innerHTML = html;
  } catch (e) {
    content.innerHTML = `<div class="empty">加载失败：${esc(e.message || e)}</div>`;
  }
}

function setCustomRange(start, end) {
  const fmtD = (d) => d.toISOString().slice(0, 10);
  $('dateStart').value = fmtD(start);
  $('dateEnd').value = fmtD(end);
  loadStats();
}

(function init() {
  $('refresh').addEventListener('click', loadStats);
  $('granularity').addEventListener('change', loadStats);
  $('range').addEventListener('change', () => {
    const isCustom = $('range').value === 'custom';
    $('customRange').classList.toggle('show', isCustom);
    if (isCustom) {
      if (!$('dateStart').value && !$('dateEnd').value) {
        const now = new Date();
        const start = new Date(now.getFullYear(), now.getMonth(), 1);
        setCustomRange(start, now);
        return;
      }
    }
    loadStats();
  });
  $('dateStart').addEventListener('change', loadStats);
  $('dateEnd').addEventListener('change', loadStats);
  $('thisMonth').addEventListener('click', () => {
    const now = new Date();
    setCustomRange(new Date(now.getFullYear(), now.getMonth(), 1), now);
  });
  $('lastMonth').addEventListener('click', () => {
    const now = new Date();
    setCustomRange(new Date(now.getFullYear(), now.getMonth() - 1, 1), new Date(now.getFullYear(), now.getMonth(), 0));
  });
  $('thisYear').addEventListener('click', () => {
    const now = new Date();
    setCustomRange(new Date(now.getFullYear(), 0, 1), now);
  });
  $('lastYear').addEventListener('click', () => {
    setCustomRange(new Date(new Date().getFullYear() - 1, 0, 1), new Date(new Date().getFullYear() - 1, 11, 31));
  });
  loadStats();
})();
</script>
</body>
</html>
