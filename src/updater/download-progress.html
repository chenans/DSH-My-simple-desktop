<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<title>下载更新</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76;
    --border: #d0d7de; --accent: #4d6bfe; --ok: #1a7f37; --err: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1f1f; --fg: #e6e6e6; --muted: #9d9d9d;
      --border: #3f3f3f; --accent: #6b85ff; --ok: #3fb950; --err: #f85149;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  body { display: flex; flex-direction: column; }

  /* Custom titlebar (frameless window) */
  .titlebar {
    height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 0 0 16px; -webkit-app-region: drag; border-bottom: 1px solid var(--border);
  }
  .titlebar-title { font-size: 13px; font-weight: 600; }
  .titlebar-btns { display: flex; -webkit-app-region: no-drag; }
  .titlebar-btn {
    width: 46px; height: 36px; border: none; background: transparent; color: var(--fg);
    cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center;
    padding: 0; outline: none;
  }
  .titlebar-btn:hover { background: rgba(128,128,128,0.15); }
  .titlebar-btn.close:hover { background: #e81123; color: #fff; }

  /* Content area */
  .content {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 24px 32px; overflow: hidden;
  }
  h2 { font-size: 16px; }
  .version { color: var(--muted); font-size: 12px; }

  .progress-wrap { width: 100%; max-width: 360px; }
  .progress-bar {
    width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--accent); border-radius: 4px;
    transition: width 0.3s ease; width: 0%;
  }
  .progress-text { text-align: center; margin-top: 6px; font-size: 13px; color: var(--muted); }

  /* Info grid: version / size / speed */
  .info-grid {
    width: 100%; max-width: 360px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px;
    font-size: 12px; color: var(--muted);
  }
  .info-grid .label { text-align: right; }
  .info-grid .value { text-align: left; color: var(--fg); }

  .status { text-align: center; font-size: 13px; color: var(--muted); min-height: 20px; }
  .status.error { color: var(--err); }
  .status.done { color: var(--ok); }

  .actions { display: flex; gap: 12px; }
  button.action {
    font: inherit; padding: 8px 20px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg);
  }
  button.action:hover { border-color: var(--accent); }
  button.action.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.action:disabled { opacity: 0.5; cursor: default; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="titlebar">
    <span class="titlebar-title">下载更新</span>
    <div class="titlebar-btns">
      <button class="titlebar-btn" id="minBtn" title="最小化到托盘">&#x2013;</button>
      <button class="titlebar-btn close" id="closeBtn" title="关闭">&#x2715;</button>
    </div>
  </div>
  <div class="content">
    <h2 id="title">正在下载更新</h2>
    <div class="version" id="version"></div>

    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
      <div class="progress-text" id="pctText">0%</div>
    </div>

    <div class="info-grid">
      <span class="label">版本：</span><span class="value" id="verInfo">—</span>
      <span class="label">已下载：</span><span class="value" id="sizeInfo">—</span>
      <span class="label">速度：</span><span class="value" id="speedInfo">—</span>
    </div>

    <div class="status" id="status">下载中…</div>

    <div class="actions" id="actions">
      <button id="installBtn" class="action primary hidden">安装更新并重启</button>
      <button id="retryBtn" class="action hidden">重试下载</button>
    </div>
  </div>

<script>
(function() {
  var fill = document.getElementById('fill');
  var pctText = document.getElementById('pctText');
  var status = document.getElementById('status');
  var title = document.getElementById('title');
  var versionEl = document.getElementById('version');
  var installBtn = document.getElementById('installBtn');
  var retryBtn = document.getElementById('retryBtn');
  var closeBtn = document.getElementById('closeBtn');
  var minBtn = document.getElementById('minBtn');
  var verInfo = document.getElementById('verInfo');
  var sizeInfo = document.getElementById('sizeInfo');
  var speedInfo = document.getElementById('speedInfo');

  function fmtBytes(n) {
    if (!n || n < 0) return '—';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1024 * 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
    return (n / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }

  function fmtSpeed(n) {
    if (!n || n < 0) return '—';
    if (n < 1024) return n + ' B/s';
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB/s';
    return (n / (1024 * 1024)).toFixed(1) + ' MB/s';
  }

  function updateUI(data) {
    var pct = data.percent || 0;
    fill.style.width = pct + '%';
    pctText.textContent = pct + '%';

    var ver = data.latestVersion || '';
    if (ver) {
      versionEl.textContent = 'v' + ver;
      verInfo.textContent = 'v' + ver;
    }

    // Size info
    if (data.total > 0) {
      sizeInfo.textContent = fmtBytes(data.downloaded) + ' / ' + fmtBytes(data.total);
    } else {
      sizeInfo.textContent = '—';
    }

    // Speed info
    speedInfo.textContent = fmtSpeed(data.speed);

    status.className = 'status';
    installBtn.classList.add('hidden');
    retryBtn.classList.add('hidden');

    if (data.state === 'downloading') {
      title.textContent = '正在下载更新';
      if (data.retryAttempt > 0) {
        status.textContent = '下载中断，正在重试（第 ' + data.retryAttempt + ' 次）…';
        speedInfo.textContent = '重试中…';
      } else {
        status.textContent = '下载中…';
      }
    } else if (data.state === 'done') {
      title.textContent = '更新已下载';
      status.textContent = '下载完成，可以安装了';
      status.className = 'status done';
      speedInfo.textContent = '完成';
      installBtn.classList.remove('hidden');
    } else if (data.state === 'error') {
      title.textContent = '下载失败';
      status.textContent = data.errorMsg || '下载过程中发生错误';
      status.className = 'status error';
      speedInfo.textContent = '—';
      retryBtn.classList.remove('hidden');
    } else if (data.state === 'cancelled') {
      title.textContent = '下载已取消';
      status.textContent = '可在托盘菜单中重新下载';
      speedInfo.textContent = '—';
    } else {
      title.textContent = '下载更新';
      status.textContent = '等待中…';
    }
  }

  if (window.dshDesktop && window.dshDesktop.download) {
    window.dshDesktop.download.onState(updateUI);
  }

  installBtn.addEventListener('click', function() {
    if (window.dshDesktop && window.dshDesktop.download) {
      window.dshDesktop.download.install();
    }
  });

  retryBtn.addEventListener('click', function() {
    if (window.dshDesktop && window.dshDesktop.download) {
      window.dshDesktop.download.retry();
    }
  });

  closeBtn.addEventListener('click', function() {
    window.close();
  });

  minBtn.addEventListener('click', function() {
    window.minimize();
  });
})();
</script>
</body>
</html>
