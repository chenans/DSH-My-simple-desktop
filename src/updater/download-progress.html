<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<title>下载更新 — DSH My Simple Desktop</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76;
    --card: #f6f8fa; --border: #d0d7de; --accent: #4d6bfe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1f1f; --fg: #e6e6e6; --muted: #9d9d9d;
      --card: #2b2b2b; --border: #3f3f3f; --accent: #6b85ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 24px 28px;
    user-select: none;
  }
  h2 { font-size: 16px; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 20px; }
  .progress-wrap {
    background: var(--card); border-radius: 8px; overflow: hidden;
    height: 28px; position: relative; border: 1px solid var(--border);
  }
  .progress-bar {
    height: 100%; background: var(--accent); border-radius: 7px;
    transition: width 0.3s ease; width: 0%;
  }
  .progress-text {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 13px; font-weight: 600; color: var(--fg);
    text-shadow: 0 0 4px var(--bg);
  }
  .stats {
    display: flex; justify-content: space-between; margin-top: 12px;
    font-size: 12px; color: var(--muted);
  }
  .done { text-align: center; padding: 20px 0; }
  .done .icon { font-size: 32px; margin-bottom: 8px; }
  .done .msg { font-size: 14px; }
  .error { text-align: center; padding: 20px 0; color: #cf222e; }
</style>
</head>
<body>
  <h2 id="title">正在下载更新…</h2>
  <p class="sub" id="subText">请勿关闭窗口，下载完成后会自动提示安装</p>

  <div id="downloading">
    <div class="progress-wrap">
      <div class="progress-bar" id="bar"></div>
      <div class="progress-text" id="pct">0%</div>
    </div>
    <div class="stats">
      <span id="speed">—</span>
      <span id="size">—</span>
    </div>
  </div>

  <div id="doneView" style="display:none;">
    <div class="done">
      <div class="icon">✓</div>
      <div class="msg">下载完成！正在准备安装…</div>
    </div>
  </div>

  <div id="errorView" style="display:none;">
    <div class="error">
      <div class="icon">✗</div>
      <div class="msg" id="errorMsg">下载失败</div>
    </div>
  </div>

<script>
'use strict';
const { ipcRenderer } = require('electron');
const $ = (id) => document.getElementById(id);

let lastTime = 0;
let lastBytes = 0;

ipcRenderer.on('update-download-progress', (_e, data) => {
  const pct = data.percent || 0;
  $('bar').style.width = pct + '%';
  $('pct').textContent = pct + '%';

  if (data.done != null && data.total != null && data.total > 0) {
    const doneMB = (data.done / 1048576).toFixed(1);
    const totalMB = (data.total / 1048576).toFixed(1);
    $('size').textContent = `${doneMB} / ${totalMB} MB`;

    const now = Date.now();
    if (lastTime > 0 && now > lastTime) {
      const elapsed = (now - lastTime) / 1000;
      const bytesDiff = data.done - lastBytes;
      if (bytesDiff > 0 && elapsed > 0) {
        const speedMB = (bytesDiff / 1048576 / elapsed).toFixed(1);
        $('speed').textContent = `${speedMB} MB/s`;
      }
    }
    lastTime = now;
    lastBytes = data.done;
  }
});

ipcRenderer.on('update-download-done', () => {
  $('downloading').style.display = 'none';
  $('doneView').style.display = 'block';
});

ipcRenderer.on('update-download-error', (_e, msg) => {
  $('downloading').style.display = 'none';
  $('errorView').style.display = 'block';
  $('errorMsg').textContent = msg || '下载失败';
});
</script>
</body>
</html>
